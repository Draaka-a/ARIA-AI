<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARIA — Onboard Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#03050a;
    --bg-1:#070c16;
    --bg-2:#0c1524;
    --line:rgba(120,196,255,0.16);
    --line-strong:rgba(120,196,255,0.32);
    --ink:#e9f5ff;
    --ink-dim:#7f93ab;
    --ink-faint:#4b5b70;
    --cyan:79,216,255;
    --cyan-solid:#4fd8ff;
    --amber:255,177,79;
    --amber-solid:#ffb14f;
    --rose:255,84,112;
    --rose-solid:#ff5470;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg-0);
    color:var(--ink);
    font-family:"Sora",system-ui,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #app{
    position:relative;
    height:100dvh;
    width:100vw;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse at 50% 18%, rgba(79,216,255,0.09), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(79,216,255,0.05), transparent 60%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1) 55%,var(--bg-2));
  }

  /* ---------- HUD ---------- */
  .hud{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--ink-dim);
    z-index:20;
    flex:0 0 auto;
  }
  .hud-top{border-bottom:1px solid var(--line);}
  .hud-bottom{border-top:1px solid var(--line);}
  .hud-cluster{display:flex;align-items:center;gap:8px;}
  .hud-mode{
    color:var(--ink);
    font-size:12px;
    font-weight:600;
    letter-spacing:.14em;
    padding:4px 14px;
    border:1px solid var(--line-strong);
    border-radius:999px;
    background:rgba(79,216,255,0.06);
    transition:color .3s, border-color .3s, background .3s;
  }
  .hud-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--ink-faint);
    box-shadow:0 0 0 rgba(0,0,0,0);
    transition:background .25s, box-shadow .25s;
  }
  .hud-dot.ok, .hud-dot.on{background:var(--cyan-solid);box-shadow:0 0 8px var(--cyan-solid);}
  .hud-btn{background:none;border:none;color:inherit;font:inherit;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;cursor:pointer;padding:0;}
  .hud-dot.bad{background:var(--rose-solid);box-shadow:0 0 8px var(--rose-solid);}
  .hud-dot.busy{background:var(--amber-solid);box-shadow:0 0 8px var(--amber-solid);animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.3;}}
  body[data-state="ERROR"] .hud-mode{color:var(--rose-solid);border-color:rgba(255,84,112,0.45);background:rgba(255,84,112,0.08);}
  body[data-state="THINKING"] .hud-mode{color:var(--amber-solid);border-color:rgba(255,177,79,0.45);}
  body[data-state="VISION_ANALYSIS"] .hud-mode,
  body[data-state="LISTENING"] .hud-mode,
  body[data-state="SPEAKING"] .hud-mode{color:var(--cyan-solid);}

  /* ---------- Stage ---------- */
  .stage{
    position:relative;
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    touch-action:none;
    overflow:hidden;
  }
  #orb-canvas{position:relative;z-index:5;pointer-events:none;}
  #hint{
    position:absolute;
    z-index:6;
    top:60%;
    left:50%;
    transform:translate(-50%,0);
    font-size:12.5px;
    color:var(--ink-dim);
    text-align:center;
    line-height:1.6;
    max-width:280px;
    transition:opacity .5s;
    pointer-events:none;
  }
  #cam-video, #cam-overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    z-index:2;
    transition:opacity .35s;
    pointer-events:none;
  }
  #cam-video.visible, #cam-overlay.visible{opacity:1;pointer-events:auto;}
  #cam-video{background:#000;transform-origin:center center;}
  #cam-overlay{z-index:3;}

  .reticle{position:absolute;inset:8%;z-index:4;pointer-events:none;}
  .reticle .corner{
    position:absolute;width:26px;height:26px;
    border:2px solid rgba(var(--cyan),0.85);
  }
  .reticle .tl{top:0;left:0;border-right:none;border-bottom:none;}
  .reticle .tr{top:0;right:0;border-left:none;border-bottom:none;}
  .reticle .bl{bottom:0;left:0;border-right:none;border-top:none;}
  .reticle .br{bottom:0;right:0;border-left:none;border-top:none;}
  .reticle::after{
    content:"ANALYZING";
    position:absolute;top:-28px;left:0;
    font-family:"JetBrains Mono",monospace;
    font-size:10px;letter-spacing:.16em;
    color:rgba(var(--cyan),0.9);
    animation:pulseText 1.4s infinite;
  }
  @keyframes pulseText{50%{opacity:.35;}}

  .tap-mark{
    position:absolute;z-index:7;width:34px;height:34px;
    border:1.5px solid var(--cyan-solid);border-radius:50%;
    transform:translate(-50%,-50%) scale(0.5);
    opacity:0;pointer-events:none;
  }
  .tap-mark.show{animation:tapPop .5s ease-out forwards;}
  @keyframes tapPop{0%{opacity:.9;transform:translate(-50%,-50%) scale(0.4);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4);}}

  /* ---------- Transcript ---------- */
  .transcript-wrap{
    position:absolute;
    left:0;right:0;bottom:150px;
    z-index:8;
    display:flex;justify-content:center;
    pointer-events:none;
  }
  #transcript{
    max-width:560px;width:92%;
    max-height:34vh;
    overflow:hidden;
    display:flex;flex-direction:column;
    gap:6px;
  }
  #transcript .line{
    font-size:13.5px;line-height:1.5;
    padding:7px 13px;border-radius:10px;
    background:rgba(9,16,28,0.55);
    border:1px solid var(--line);
    backdrop-filter:blur(6px);
    animation:lineIn .28s ease-out;
    color:var(--ink);
  }
  #transcript .line.user{color:var(--cyan-solid);border-color:rgba(79,216,255,0.3);align-self:flex-end;}
  #transcript .line.ai{color:var(--ink);}
  @keyframes lineIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  #interim{
    text-align:center;font-size:12.5px;color:var(--ink-dim);font-style:italic;
    min-height:18px;margin-top:2px;
  }

  /* ---------- Banner ---------- */
  #banner{
    position:absolute;left:50%;top:70px;transform:translateX(-50%);
    z-index:30;max-width:min(92%,480px);
    background:rgba(var(--cyan),0.10);               /* info (default): neutral, nothing is wrong */
    border:1px solid rgba(var(--cyan),0.40);
    color:#d8f4ff;
    padding:10px 16px;border-radius:10px;
    font-size:13px;line-height:1.4;text-align:center;
  }
  #banner[data-tone="warn"]{                         /* something didn't work, ARIA is fine, here is what to do */
    background:rgba(var(--amber),0.12);border-color:rgba(var(--amber),0.45);color:#ffe9c2;
  }
  #banner[data-tone="error"]{                        /* reserved for problems that need a settings change (blocked permissions) */
    background:rgba(255,84,112,0.12);border-color:rgba(255,84,112,0.45);color:#ffd7dd;
  }

  /* ---------- Controls ---------- */
  .cam-controls{
    position:absolute;z-index:9;
    left:0;right:0;bottom:150px;
    display:flex;justify-content:center;gap:10px;
    flex-wrap:wrap;row-gap:8px;padding:0 8px;         /* "HAND TRACKING: LOADING…" is long: wrap instead of overflowing */
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .cam-controls.show{opacity:1;pointer-events:auto;}
  .chip{
    display:flex;align-items:center;gap:6px;
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.05em;
    padding:7px 11px;border-radius:999px;white-space:nowrap;
    background:rgba(9,16,28,0.65);
    border:1px solid var(--line);color:var(--ink-dim);
    backdrop-filter:blur(6px);
  }
  .chip svg{width:14px;height:14px;}
  .icon-btn.small{width:34px;height:34px;}

  footer.controls{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    gap:16px;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    z-index:20;
    border-top:1px solid var(--line);
    background:rgba(4,7,13,0.4);
  }
  .icon-btn{
    width:54px;height:54px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(79,216,255,0.06);
    border:1px solid var(--line-strong);
    color:var(--ink);
    cursor:pointer;
    transition:background .2s, transform .15s, border-color .2s, color .2s;
  }
  .icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;}
  .icon-btn:active{transform:scale(0.92);}
  .icon-btn.primary{width:64px;height:64px;background:rgba(79,216,255,0.1);}
  .icon-btn.active{background:var(--cyan-solid);border-color:var(--cyan-solid);color:#03121a;}
  .icon-btn.active svg{stroke:#03121a;}
  .icon-btn:disabled{opacity:.35;cursor:not-allowed;}

  /* ---------- Text input fallback ---------- */
  #text-form{
    position:absolute;left:0;right:0;bottom:96px;
    z-index:25;
    display:flex;gap:8px;
    justify-content:center;
    padding:0 16px;
  }
  #text-form[hidden]{display:none;}
  #text-input{
    flex:1;max-width:460px;
    background:rgba(9,16,28,0.85);
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:11px 18px;
    color:var(--ink);font-family:"Sora",sans-serif;font-size:14px;
    outline:none;
  }
  #text-input:focus{border-color:var(--cyan-solid);}
  #text-form button{
    background:var(--cyan-solid);border:none;border-radius:999px;
    padding:0 18px;font-family:"Sora",sans-serif;font-weight:600;
    color:#03121a;cursor:pointer;
  }

  /* ---------- Music player (MUSIC state) ----------
     The orb itself is the hero: in MUSIC state it morphs into a music note
     (see renderOrb) and slides/shrinks up to make room, exactly like the timer
     display takes over the orb. The panel below is just the controls. */
  #orb-canvas{transition:transform .7s cubic-bezier(.22,.8,.24,1);}
  body.music-layout #orb-canvas{
    transform:translate(var(--mp-dx,0px),var(--mp-dy,0px)) scale(var(--mp-scale,1));
  }
  .transcript-wrap{transition:bottom .5s cubic-bezier(.22,.8,.24,1);}
  .cam-controls{transition:opacity .3s, bottom .5s cubic-bezier(.22,.8,.24,1);}
  body.music-layout:not(.music-side) .transcript-wrap,
  body.music-layout:not(.music-side) .cam-controls{bottom:var(--mp-tb,150px);}
  body[data-state="MUSIC"] .hud-mode{color:var(--cyan-solid);}

  .music-panel{
    position:absolute;z-index:10;
    left:50%;bottom:10px;
    width:min(calc(100% - 24px),400px);
    padding:10px 14px 12px;
    display:flex;flex-direction:column;gap:5px;
    background:rgba(7,12,22,0.74);
    border:1px solid var(--line);
    border-radius:var(--radius);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    overflow-x:hidden;overflow-y:auto;   /* vertical scroll only kicks in on very short screens */
    overscroll-behavior:contain;
    opacity:0;visibility:hidden;pointer-events:none;
    transform:translate(-50%,14px);
    transition:opacity .28s ease, transform .28s ease, visibility 0s linear .28s;
  }
  .music-panel::before{  /* thin HUD accent line along the top edge */
    content:"";position:absolute;left:14px;right:14px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(var(--cyan),0.7),transparent);
  }
  /* controls appear a beat AFTER the orb starts morphing (open), and leave
     BEFORE it morphs back (close — JS delays the state change to match) */
  body.music-open .music-panel{
    opacity:1;visibility:visible;pointer-events:auto;
    transform:translate(-50%,0);
    transition:opacity .4s ease .35s, transform .4s ease .35s, visibility 0s linear .35s;
  }
  body.music-side .music-panel{
    left:auto;right:12px;top:50%;bottom:auto;
    width:min(360px,46%);
    transform:translate(0,calc(-50% + 14px));
  }
  body.music-side.music-open .music-panel{transform:translate(0,-50%);}

  .mp-head{
    display:flex;align-items:center;gap:8px;
    font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;color:var(--ink-dim);
  }
  .mp-tag{color:var(--ink);font-weight:600;}
  .mp-count{margin-left:auto;}
  .mp-close{
    width:32px;height:32px;margin:-6px -8px -6px 0;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:none;border:none;border-radius:50%;color:var(--ink-dim);cursor:pointer;padding:0;
    transition:color .2s, background .2s;
  }
  .mp-close:hover{color:var(--ink);background:rgba(79,216,255,0.08);}
  .mp-close svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;}

  .mp-meta{min-width:0;padding-top:2px;}
  .mp-title{
    font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--ink);line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mp-sub{
    font-size:11.5px;color:var(--ink-dim);line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:color .25s;
  }
  .mp-sub.err{color:var(--rose-solid);}

  .mp-seek{display:flex;align-items:center;gap:9px;}
  .mp-time{
    flex:0 0 auto;min-width:38px;
    font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.04em;color:var(--ink-dim);
  }
  .mp-time:last-child{text-align:right;}

  .mp-range{
    -webkit-appearance:none;appearance:none;
    flex:1 1 auto;min-width:0;width:100%;
    height:28px;margin:0;padding:0;
    background:transparent;cursor:pointer;outline:none;
    touch-action:none;
    --p:0%;
  }
  .mp-range::-webkit-slider-runnable-track{
    height:3px;border-radius:2px;
    background:linear-gradient(to right,var(--cyan-solid) var(--p),rgba(120,196,255,0.18) var(--p));
  }
  .mp-range::-moz-range-track{height:3px;border-radius:2px;background:rgba(120,196,255,0.18);}
  .mp-range::-moz-range-progress{height:3px;border-radius:2px;background:var(--cyan-solid);}
  .mp-range::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:12px;height:12px;margin-top:-4.5px;border-radius:50%;
    background:#eaf8ff;border:1px solid var(--cyan-solid);
    box-shadow:0 0 8px rgba(var(--cyan),0.55);
  }
  .mp-range::-moz-range-thumb{
    width:10px;height:10px;border-radius:50%;
    background:#eaf8ff;border:1px solid var(--cyan-solid);
    box-shadow:0 0 8px rgba(var(--cyan),0.55);
  }
  .mp-range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(var(--cyan),0.35);}
  .mp-range:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px rgba(var(--cyan),0.35);}
  .mp-range:disabled{opacity:.4;cursor:default;}

  .mp-transport{display:flex;align-items:center;justify-content:space-between;padding:1px 2px 0;}
  .mp-btn{
    position:relative;flex:0 0 auto;
    width:42px;height:42px;border-radius:50%;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(79,216,255,0.05);
    border:1px solid var(--line);
    color:var(--ink);cursor:pointer;
    transition:background .2s, border-color .2s, color .2s, transform .15s, box-shadow .2s;
  }
  .mp-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .mp-btn .fill{fill:currentColor;}
  .mp-btn:hover{border-color:var(--line-strong);}
  .mp-btn:active{transform:scale(0.92);}
  .mp-btn:focus-visible,.mp-close:focus-visible{outline:2px solid rgba(var(--cyan),0.6);outline-offset:2px;}
  .mp-btn:disabled{opacity:.35;cursor:not-allowed;}
  .mp-btn.step{width:46px;height:46px;}
  .mp-btn.main{
    width:56px;height:56px;border-color:var(--line-strong);
    background:rgba(79,216,255,0.1);box-shadow:0 0 14px rgba(var(--cyan),0.12);
  }
  .mp-btn.main svg{width:22px;height:22px;}
  .mp-btn.toggle{color:var(--ink-dim);}
  .mp-btn.toggle.on{color:var(--amber-solid);border-color:rgba(var(--amber),0.45);background:rgba(var(--amber),0.08);}
  #mp-play .i-pause{display:none;}
  #mp-play.is-playing .i-play{display:none;}
  #mp-play.is-playing .i-pause{display:inline;}
  #mp-repeat .one{display:none;}
  #mp-repeat[data-mode="one"] .one{display:inline;}
  .mp-btn.mini{width:36px;height:36px;border-color:transparent;background:none;color:var(--ink-dim);}
  .mp-btn.mini svg{width:17px;height:17px;}
  #mp-mute .slash{display:none;}
  #mp-mute.muted .slash{display:inline;}
  #mp-mute.muted .wave{opacity:.25;}

  .mp-vol{display:flex;align-items:center;gap:6px;}
  .mp-vol .mp-range{min-width:56px;}
  .mp-timer{
    flex:0 0 auto;display:flex;align-items:center;gap:5px;
    font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.05em;color:var(--ink-dim);
    padding:3px 9px;border:1px solid var(--line);border-radius:999px;
  }
  .mp-timer[hidden]{display:none;}
  .mp-timer svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;}

  /* while the player is open, the last spoken/typed line fades out after a few
     seconds so it stops covering the orb (it re-appears with every new line) */
  @keyframes mpLineFade{to{opacity:0;}}
  body.music-layout #transcript .line{animation:lineIn .28s ease-out, mpLineFade .7s ease 5s forwards;}

  /* short screens (phone in landscape): compact controls so everything fits */
  @media (max-height:420px){
    body.music-side .mp-head{display:none;}      /* the footer note button / "close music player" still close it */
    body.music-side .music-panel{padding:7px 12px 8px;gap:1px;}
    body.music-side .mp-title{font-size:14px;}
    body.music-side .mp-range{height:22px;}
    body.music-side .mp-btn{width:34px;height:34px;}
    body.music-side .mp-btn.step{width:38px;height:38px;}
    body.music-side .mp-btn.main{width:44px;height:44px;}
    body.music-side .mp-btn.mini{width:30px;height:30px;}
  }
  @media (max-width:360px){
    .music-panel{padding:9px 12px 10px;}
    .mp-btn{width:38px;height:38px;}
    .mp-btn.step{width:42px;height:42px;}
    .mp-btn.main{width:52px;height:52px;}
    .mp-btn.mini{width:34px;height:34px;}
    .mp-seek{gap:7px;}
    .mp-time{min-width:34px;}
  }
  @media (prefers-reduced-motion: reduce){
    .music-panel,#orb-canvas,.transcript-wrap,.cam-controls{transition-duration:.01ms !important;transition-delay:0s !important;}
  }

  ::selection{background:rgba(79,216,255,0.3);}

  @media (max-width:480px){
    .hud{font-size:10px;padding:12px 12px;}
    .icon-btn{width:50px;height:50px;}
    .icon-btn.primary{width:60px;height:60px;}
    #transcript{width:96%;}
  }

  @media (prefers-reduced-motion: reduce){
    .line, .reticle::after, .hud-dot.busy{animation-duration:.01ms !important;}
  }
</style>
</head>
<body data-state="IDLE">
<div id="app">

  <header class="hud hud-top">
    <div class="hud-cluster">
      <span class="hud-dot ok" id="dot-conn"></span>
      <span id="lbl-conn">ONLINE</span>
    </div>
    <div class="hud-cluster"><span class="hud-mode" id="lbl-mode">IDLE</span></div>
    <div class="hud-cluster"><span id="lbl-clock">00:00:00</span></div>
  </header>

  <main class="stage" id="stage">
    <canvas id="orb-canvas"></canvas>
    <div id="hint">Tap the mic to talk, or say &ldquo;open the camera.&rdquo;<br>You can also type below.</div>

    <video id="cam-video" playsinline autoplay muted></video>
    <canvas id="cam-overlay"></canvas>
    <div class="reticle" id="reticle" hidden>
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>

    <div id="banner" hidden></div>

    <section class="music-panel" id="music-panel" aria-label="Music player" aria-hidden="true">
      <div class="mp-head">
        <span class="hud-dot" id="mp-dot"></span>
        <span class="mp-tag">MUSIC</span>
        <span class="mp-count" id="mp-count">00 / 00</span>
        <button class="mp-close" id="mp-close" type="button" title="Close music player" aria-label="Close music player">

<script>
(function(){
'use strict';

/* ============================================================
   DOM references
   ============================================================ */
const $ = (id) => document.getElementById(id);
const orbCanvas = $('orb-canvas'), orbCtx = orbCanvas.getContext('2d');
const stage = $('stage');
const camVideo = $('cam-video'), camOverlay = $('cam-overlay'), camCtx = camOverlay.getContext('2d');
const reticle = $('reticle');
const hintEl = $('hint');
const bannerEl = $('banner');
const transcriptEl = $('transcript'), interimEl = $('interim');
const lineUserEl = $('line-user'), lineAiEl = $('line-ai');
const lblMode = $('lbl-mode'), lblClock = $('lbl-clock'), lblConn = $('lbl-conn');
const dotConn = $('dot-conn'), dotMic = $('dot-mic'), dotCam = $('dot-cam'), dotAi = $('dot-ai');
const lblAiStatus = $('lbl-ai-status');
const btnMic = $('btn-mic'), btnCam = $('btn-cam'), btnKeyboard = $('btn-keyboard');
const btnMusic = $('btn-music');
const langToggleEl = $('btn-lang-toggle');
const camControls = $('cam-controls');
const btnSwitchCam = $('btn-switch-cam'), btnSnap = $('btn-snap'), btnHand = $('btn-hand');
const gestureLbl = $('gesture-mode'), zoomLbl = $('zoom-lbl');
const textForm = $('text-form'), textInput = $('text-input');

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   Central application state machine
   ============================================================ */
const State = { current: 'IDLE' };
function restState(){
  if (musicActive) return 'MUSIC';   /* explicit mode — the mic stays on underneath so voice control keeps working */
  if (micOn) return 'LISTENING';
  if (camOn) return 'CAMERA';
  if (timerActive) return 'TIMER_ACTIVE';
  return 'IDLE';
}
function setState(next, opts){
  opts = opts || {};
  State.current = next;
  document.body.dataset.state = next;
  lblMode.textContent = next.replace('_',' ');
  reticle.hidden = next !== 'VISION_ANALYSIS';
  if (next === 'ERROR') showBanner(opts.message || 'Something went wrong.', false, 'error');
  else hideBanner();
}

let bannerTimer = null;
function showBanner(msg, sticky, tone){
  bannerEl.textContent = msg;
  bannerEl.dataset.tone = tone || 'info';
  bannerEl.hidden = false;
  clearTimeout(bannerTimer);
  if (!sticky) bannerTimer = setTimeout(hideBanner, tone === 'warn' ? 8000 : 6000);
}
function hideBanner(){ bannerEl.hidden = true; }

/* ============================================================
   Developer diagnostics vs. what the user reads
   One rule for the whole file: the console (logIssue) carries the technical truth — error name, message, status
   codes — and the UI only ever gets a short, calm sentence that says what happened and what to do next.
   Banner tones:  info = nothing is wrong,  warn = recoverable, ARIA keeps working,  error = needs a settings change.
   Add ?debug=1 to the URL to append the technical detail to those sentences (handy on a phone with no devtools).
   ============================================================ */
const DEBUG_UI = /[?&]debug(=|&|$)/.test(location.search);
function techText(err){
  if (err == null) return '';
  const base = (err.name && err.message) ? err.name + ': ' + err.message : (err.message || String(err));
  return base + (err.ariaAttempts > 1 ? ' (tried ' + err.ariaAttempts + ' times)' : '');
}
function logIssue(area, err){
  console.error('[ARIA] ' + area + (err != null ? ' \u2014 ' + techText(err) : ''), ...(err && typeof err === 'object' ? [err] : []));
}
const withDebug = (text, err) => (DEBUG_UI && err != null) ? text + ' [' + techText(err) + ']' : text;
/* a recoverable problem: amber banner, no red state, nothing added to the conversation */
function notifyIssue(text, err){ showBanner(withDebug(text, err), false, 'warn'); }

function addTranscript(who, text){
  hintEl.style.opacity = '0';
  const el = who === 'user' ? lineUserEl : lineAiEl;
  el.textContent = text;
  el.hidden = false;
  /* re-trigger the reveal animation on every update — reusing the same
     element means it won't replay automatically like a freshly-created one would */
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

/* clock + connection */
function tickClock(){ lblClock.textContent = new Date().toLocaleTimeString('en-GB',{hour12:false}); }
setInterval(tickClock, 1000); tickClock();
function updateConn(){
  const online = navigator.onLine;
  dotConn.classList.toggle('ok', online);
  dotConn.classList.toggle('bad', !online);
  lblConn.textContent = online ? 'ONLINE' : 'OFFLINE';
}
window.addEventListener('online', updateConn);
window.addEventListener('offline', updateConn);
updateConn();

/* ============================================================
   AI service — layered provider abstraction:
     1) window.claude "sample" capability — only present when this page
        is loaded inside a Claude.ai Artifact viewer
     2) a same-origin backend proxy at /api/chat and /api/vision, for
        standalone deployments (see server.js + README) — the proxy
        holds the real API key server-side, never in this file
     3) a local, rule-based reply, so the app still runs without either
        backend connected, just without real reasoning

   Tier 2 used to disable itself PERMANENTLY (backendAvailable = false)
   after a single failed call — one rate-limit or transient upstream
   error and ARIA was stuck on the tier-3 canned reply for the rest of
   the session, even once the backend recovered. It's now a short,
   self-expiring cooldown instead: a failure skips the backend for a
   bit, then automatically tries it again — no page reload needed, and
   no per-message retry storm either.
   ============================================================ */
let aiSample = null, aiLimits = null;
let backendCooldownUntil = 0; /* 0 = eligible to try now */
const BACKEND_RETRY_MS = 15000;

async function initAI(){
  try {
    if (window.claude && window.claude.use) {
      aiSample = await window.claude.use('sample');
      if (aiSample) { try { aiLimits = await aiSample.limits(); } catch(_e){ aiLimits = null; } }
    }
  } catch(_e){ aiSample = null; }
  if (aiSample){ lblAiStatus.textContent = 'AI LINKED'; return; }
  lblAiStatus.textContent = 'LOCAL MODE';
  /* not running inside a Claude.ai Artifact — see if a local backend
     proxy (server.js) is reachable on this same origin instead. A 200
     here only means the server process is up, NOT that the AI provider
     is actually usable — "configured" reflects whether its API key is
     present (see server.js), without spending a real API call to check. */
  try {
    const res = await fetch('/api/health');
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.configured){
      lblAiStatus.textContent = 'AI LINKED';
    } else if (res.ok){
      console.warn('[ARIA] Backend is running but has no provider API key configured.');
    }
  } catch(_e){ /* no local backend either — stays LOCAL MODE */ }
}
initAI();

let downloadsCap = null;
(async function initDownloads(){
  try { if (window.claude && window.claude.use) downloadsCap = await window.claude.use('downloads'); }
  catch(_e){ downloadsCap = null; }
})();

const PERSONA = "You are ARIA, an onboard voice-and-vision assistant speaking through text-to-speech inside a browser app. Reply in 1 to 3 short spoken sentences, plain language, no markdown, no lists, no headers.";
let chatHistory = [];
function trimHistory(){ while (chatHistory.length > 12) chatHistory.shift(); }

function setAiBusy(on){ dotAi.classList.toggle('busy', !!on); }

function aiErrorMessage(e){
  const code = e && e.code;
  const map = {
    not_granted: "I need permission to use AI before I can answer — allow AI access if you'd like real answers.",
    rate_limited: "I'm a little busy right now — try again in a moment.",
    refused: "I can't help with that one.",
    images_unavailable: "I can't look at images in this session, but I can still hear and speak.",
    image_rejected: "That camera frame didn't come through cleanly — try again.",
    sampling_disabled: "My AI service isn't available right now.",
    not_declared: "My AI service isn't available right now.",
    capability_disabled: "My AI service isn't available right now.",
    capability_removed: "My AI service isn't available right now.",
    empty_completion: "I didn't come up with anything — try rephrasing.",
    session_expired: "You'll need to sign in again for me to keep answering.",
    invalid_json: "I couldn't make sense of that answer — try again.",
  };
  if (!map[code]) logIssue('ai request', e);
  return map[code] || "I couldn't reach my AI service. Try again in a moment.";
}

/* Backend proxy calls — used only when the platform "sample" capability
   isn't present. Talks to the same-origin server in server.js, which is
   the only place the real API key ever lives.

   Returns a structured result instead of swallowing everything into
   null, so the caller can log *why* it failed (status code + message —
   never the key, which never reaches this file at all) and decide how
   long to back off: auth-looking failures (401/403) get a longer
   cooldown since retrying immediately won't help until the key itself
   is fixed; everything else (timeouts, network blips, 429s, 5xx,
   malformed responses) is treated as transient. */
function classifyBackendFailure(status){
  return { ok:false, status: status || 0, permanent: status === 401 || status === 403 };
}
async function backendChat(userText){
  try {
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:userText, history:chatHistory}),
      signal: AbortSignal.timeout(20000)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.text){
      console.error('[ARIA] /api/chat failed:', res.status, data.error || '(no text in response)');
      return classifyBackendFailure(res.status);
    }
    lblAiStatus.textContent = 'AI LINKED';
    return { ok:true, text: data.text };
  } catch(e){
    console.error('[ARIA] /api/chat request error:', e && (e.name === 'TimeoutError' ? 'timed out' : e.message));
    return classifyBackendFailure(0);
  }
}
async function backendVision(blob, question){
  try {
    const form = new FormData();
    form.append('image', blob, 'frame.jpg');
    form.append('question', question);
    const res = await fetch('/api/vision', { method:'POST', body:form, signal: AbortSignal.timeout(20000) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.text){
      console.error('[ARIA] /api/vision failed:', res.status, data.error || '(no text in response)');
      return classifyBackendFailure(res.status);
    }
    lblAiStatus.textContent = 'AI LINKED';
    return { ok:true, text: data.text };
  } catch(e){
    console.error('[ARIA] /api/vision request error:', e && (e.name === 'TimeoutError' ? 'timed out' : e.message));
    return classifyBackendFailure(0);
  }
}

const AIService = {
  async chat(userText){
    if (aiSample){
      setAiBusy(true);
      const turns = [{role:'user', content: PERSONA}].concat(chatHistory, [{role:'user', content:userText}]);
      try {
        const res = await aiSample(turns, {modelTier:'quick', cache:false});
        chatHistory.push({role:'user', content:userText}, {role:'assistant', content:res.text});
        trimHistory();
        return res.text;
      } catch(e){ return aiErrorMessage(e); }
      finally { setAiBusy(false); }
    }
    if (Date.now() >= backendCooldownUntil){
      setAiBusy(true);
      const result = await backendChat(userText);
      setAiBusy(false);
      if (result.ok){
        backendCooldownUntil = 0;
        chatHistory.push({role:'user', content:userText}, {role:'assistant', content:result.text});
        trimHistory();
        return result.text;
      }
      backendCooldownUntil = Date.now() + (result.permanent ? BACKEND_RETRY_MS * 4 : BACKEND_RETRY_MS);
    }
    return "I heard \u201c" + userText + "\u201d, but I can't reach my AI service right now. I can still run direct commands \u2014 try camera, zoom, or snapshot.";
  },
  async analyzeImage(blob, question){
    if (aiSample && aiLimits && aiLimits.images){
      setAiBusy(true);
      const prompt = PERSONA + " You are looking at one live camera frame. " + question +
        " Answer in 1-2 short spoken sentences. If you genuinely can't tell, say so plainly instead of guessing.";
      try {
        const res = await aiSample(prompt, {images: blob, modelTier:'quick', cache:false});
        return res.text;
      } catch(e){ return aiErrorMessage(e); }
      finally { setAiBusy(false); }
    }
    if (Date.now() >= backendCooldownUntil){
      setAiBusy(true);
      const result = await backendVision(blob, question);
      setAiBusy(false);
      if (result.ok){
        backendCooldownUntil = 0;
        return result.text;
      }
      backendCooldownUntil = Date.now() + (result.permanent ? BACKEND_RETRY_MS * 4 : BACKEND_RETRY_MS);
    }
    return "I can't analyze the camera view right now \u2014 please try again in a moment. I can still hear and speak.";
  }
};

/* ============================================================
   Natural-language intent / action layer
   ============================================================ */
/* Strips a leading address like "ARIA," or "Hey ARIA" and trailing
   punctuation before matching, so natural phrasing ("ARIA, turn on the
   flashlight") matches the same patterns as the bare command would. */
function normalizeCommand(text){
  return (text || '')
    .toLowerCase()
    .replace(/^\s*(hey\s+)?aria[,!.\s]+/i, '')
    .replace(/[!?.]+$/, '')
    .trim();
}

/* ---- Music-player voice commands ----
   Checked first in matchIntent(), still before any AI call. Every pattern
   needs a music word (music / song / track / player …) or — for the bare
   words handled in matchMusicIntent — the player to be open, so none of them
   can steal an existing camera / timer / zoom phrase ("go back", "stop",
   "silence" … all behave exactly as before). English plus a few Indonesian
   equivalents, since the mic language toggle defaults to ID on Indonesian devices. */
const MUSIC_INTENTS = [
  {re:/\b(close|exit|quit|hide|shut|stop|turn off)\b.*\b(music|songs?|player)\b|\b(tutup|matikan|hentikan)\b.*\b(musik|music|lagu|pemutar|player)\b/i, action:'MUSIC_CLOSE'},
  {re:/\b(next|skip)\b.*\b(songs?|tracks?|music)\b|\bplay (the )?next\b|\bskip this\b|\b(lagu|musik)\b.*\b(berikutnya|selanjutnya)\b|\bganti lagu\b|\bskip lagu\b/i, action:'MUSIC_NEXT'},
  {re:/\b(previous|prev|last|back)\b.*\b(songs?|tracks?)\b|\bplay (the )?(previous|last)\b|\blagu\b.*\bsebelumnya\b|\bkembali ke lagu\b/i, action:'MUSIC_PREV'},
  {re:/\bpause\b.*\b(music|songs?|tracks?|player|playback)\b|\b(jeda|pause)\b.*\b(musik|lagu)\b/i, action:'MUSIC_PAUSE'},
  {re:/\b(resume|continue|unpause)\b.*\b(music|songs?|tracks?|playing|player|playback)\b|\b(lanjutkan|teruskan)\b.*\b(musik|lagu)\b/i, action:'MUSIC_RESUME'},
  {re:/\b(open|launch|show|activate|turn on|start)\b.*\b(music player|music mode|player)\b|\b(open|launch|show|activate)\b.*\b(music|songs)\b|\b(buka|bukakan|aktifkan|tampilkan)\b.*\b(musik|music|pemutar|player)\b/i, action:'MUSIC_OPEN'},
  {re:/\b(play|start|put on|turn on)\b.*\b(music|songs?|tracks?|playlist)\b|\bplay something\b|\b(putar|putarkan|mainkan|setel|setelkan|nyalakan)\b.*\b(musik|lagu)\b/i, action:'MUSIC_PLAY'},
  {re:/\bshuffle\b.*\b(music|songs?|tracks?|playlist|queue)\b|\b(music|songs?|tracks?|playlist)\b.*\bshuffle\b|\bacak\b.*\b(lagu|musik)\b/i, action:'MUSIC_SHUFFLE'},
  {re:/\b(repeat|loop)\b.*\b(this|the|that)?\s*(songs?|tracks?|music|playlist|queue)\b|\bulangi\b.*\b(lagu|musik)\b/i, action:'MUSIC_REPEAT'},
  {re:/\bvolume\b.*\b(music|songs?)\b|\b(music|songs?)\b.*\bvolume\b|\b(naikkan|turunkan|kecilkan|besarkan)\b.*\bvolume\b/i, action:'MUSIC_VOLUME'},
];
function matchMusicIntent(text){
  for (const i of MUSIC_INTENTS) if (i.re.test(text)) return i.action;
  if (!musicActive) return null;
  /* with the player open, the bare words work too ("pause", "next", "volume up"…) */
  const bare = {
    'pause':'MUSIC_PAUSE', 'resume':'MUSIC_RESUME', 'play':'MUSIC_RESUME', 'continue':'MUSIC_RESUME',
    'next':'MUSIC_NEXT', 'skip':'MUSIC_NEXT', 'next song':'MUSIC_NEXT', 'next track':'MUSIC_NEXT',
    'previous':'MUSIC_PREV', 'previous song':'MUSIC_PREV', 'previous track':'MUSIC_PREV',
    'mute':'MUSIC_VOLUME', 'unmute':'MUSIC_VOLUME', 'jeda':'MUSIC_PAUSE', 'lanjut':'MUSIC_RESUME'
  }[text];
  if (bare) return bare;
  if (/\bshuffle\b/.test(text)) return 'MUSIC_SHUFFLE';
  if (/^(repeat|loop)( (one|this song|this track|all|off|on|song|track|playlist))?$/.test(text) || /\b(stop|disable|turn off)\b.*\b(repeat|loop)(ing)?\b/.test(text)) return 'MUSIC_REPEAT';
  if (/\bvolume\b|\b(louder|quieter)\b/.test(text)) return 'MUSIC_VOLUME';
  return null;
}

const INTENTS = [
  {re:/\b(open|start|turn on|activate)\b.*\bcamera\b|\blook at this\b|\bcheck this out\b/i, action:'CAMERA_ON'},
  {re:/\b(close|stop|turn off)\b.*\bcamera\b|\bgo back\b/i, action:'CAMERA_OFF'},
  {re:/\bswitch\b.*\bcamera\b|\bother camera\b|\bflip camera\b|\bfront camera\b|\bback camera\b/i, action:'CAMERA_SWITCH'},
  {re:/\b(turn on|switch on|activate)\b.*\bflashlight\b/i, action:'FLASHLIGHT_ON'},
  {re:/\b(turn off|switch off|deactivate)\b.*\bflashlight\b/i, action:'FLASHLIGHT_OFF'},
  {re:/\b(set|start)\b.*\btimer\b/i, action:'TIMER_SET'},
  {re:/\b(cancel|stop)\b.*\btimer\b/i, action:'TIMER_CANCEL'},
  {re:/\bzoom in\b|\bcloser look\b|\bget closer\b|\btake a closer look\b/i, action:'ZOOM_IN'},
  {re:/\bzoom out\b|\bstep back\b|\bzoom back\b/i, action:'ZOOM_OUT'},
  {re:/\b(take|grab)\b.*\b(snapshot|screenshot|photo|picture)\b|\bsnapshot\b/i, action:'SNAPSHOT'},
  {re:/\bstop listening\b/i, action:'MIC_OFF'},
  {re:/\bstop speaking\b|\bbe quiet\b|\bsilence\b/i, action:'STOP_SPEAK'},
  {re:/^\s*stop\s*$/i, action:'STOP_ALL'},
];
function matchIntent(rawText){
  const text = normalizeCommand(rawText);
  const musicAction = matchMusicIntent(text);
  if (musicAction) return musicAction;
  /* Standalone toggle words are an intentional exception to the substring
     patterns below — checked as an exact match (not \bcamera\b anywhere)
     specifically so "I was testing the camera yesterday" does NOT trigger
     this, only a message that, once normalized, IS just that one word. */
  if (text === 'camera') return camOn ? 'CAMERA_OFF' : 'CAMERA_ON';
  if (text === 'flashlight') return torchIsOn() ? 'FLASHLIGHT_OFF' : 'FLASHLIGHT_ON';
  for (const i of INTENTS) if (i.re.test(text)) return i.action;
  return null;
}

/* ---- Voice-controlled countdown timer ----
   Runs entirely client-side and is checked before any AI/OpenRouter call
   (see matchIntent above), so it keeps working even when the backend is
   rate-limited or offline. The countdown itself piggybacks on the existing
   requestAnimationFrame orb-render loop (see renderOrb) instead of a
   separate setInterval — remaining time is always recomputed from an
   absolute target timestamp (timerEndAt - Date.now()), so it can't drift
   the way repeatedly decrementing a counter every ~1000ms can. */
let timerActive = false;
let musicActive = false;   /* Music Player mode flag (see MusicPlayer below) */
let timerEndAt = 0;
let timerTotalMs = 0;
let timerCompleteTimeout = null;

function parseDurationSeconds(text){
  let total = 0, matched = false;
  const h = text.match(/(\d+)\s*(?:hours?|hrs?)\b/i);
  if (h){ total += parseInt(h[1],10) * 3600; matched = true; }
  const m = text.match(/(\d+)\s*(?:minutes?|mins?)\b/i);
  if (m){ total += parseInt(m[1],10) * 60; matched = true; }
  const s = text.match(/(\d+)\s*(?:seconds?|secs?)\b/i);
  if (s){ total += parseInt(s[1],10); matched = true; }
  return (matched && total > 0) ? total : null;
}
function formatDuration(ms){
  const totalSec = Math.max(0, Math.round(ms/1000));
  const hh = Math.floor(totalSec/3600);
  const mm = Math.floor((totalSec%3600)/60);
  const ss = totalSec%60;
  const pad = (n) => String(n).padStart(2,'0');
  return hh > 0 ? (pad(hh)+':'+pad(mm)+':'+pad(ss)) : (pad(mm)+':'+pad(ss));
}
function startTimerFromText(rawText){
  const seconds = parseDurationSeconds(rawText || '');
  if (!seconds){
    const msg = "I didn't catch a valid duration — try something like 'set a timer for 5 minutes.'";
    addTranscript('ai', msg);
    speak(msg);
    return;
  }
  const wasActive = timerActive;
  clearTimeout(timerCompleteTimeout);
  timerActive = true;
  timerTotalMs = seconds * 1000;
  timerEndAt = Date.now() + timerTotalMs;
  setState(musicActive ? 'MUSIC' : 'TIMER_ACTIVE');   /* with the player open the orb stays a note; its panel shows the countdown */
  addTranscript('ai', (wasActive ? 'Replacing the current timer — now set for ' : 'Timer set for ') + formatDuration(seconds*1000) + '.');
}
function cancelTimer(){
  if (!timerActive){
    addTranscript('ai', 'No timer is currently running.');
    return;
  }
  timerActive = false;
  clearTimeout(timerCompleteTimeout);
  addTranscript('ai', 'Timer cancelled.');
  setState(restState());
}
function completeTimer(){
  timerActive = false;
  setState('TIMER_COMPLETE');
  const msg = 'Your timer is complete.';
  addTranscript('ai', msg);
  speak(msg);
  /* safety net: return to normal even if speechSynthesis is unsupported
     (speak() would then never fire the onend that normally does this) */
  timerCompleteTimeout = setTimeout(() => {
    if (State.current === 'TIMER_COMPLETE') setState(restState());
  }, 3000);
}

async function runAction(action, rawText){
  switch(action){
    case 'CAMERA_ON': await startCamera(); break;
    case 'CAMERA_OFF': stopCamera(); break;
    case 'CAMERA_SWITCH': await switchCamera(); break;
    case 'FLASHLIGHT_ON': await setTorch(true); break;
    case 'FLASHLIGHT_OFF': await setTorch(false); break;
    case 'TIMER_SET': startTimerFromText(rawText); break;
    case 'TIMER_CANCEL': cancelTimer(); break;
    case 'ZOOM_IN': nudgeZoom(0.3); break;
    case 'ZOOM_OUT': nudgeZoom(-0.3); break;
    case 'SNAPSHOT': await takeSnapshot(); break;
    case 'MIC_OFF': stopMic(); break;
    case 'STOP_SPEAK': stopSpeaking(); setState(restState()); break;
    case 'STOP_ALL': stopSpeaking(); stopMic(); break;
    case 'MUSIC_OPEN': case 'MUSIC_PLAY': case 'MUSIC_CLOSE': case 'MUSIC_PAUSE': case 'MUSIC_RESUME':
    case 'MUSIC_NEXT': case 'MUSIC_PREV': case 'MUSIC_SHUFFLE': case 'MUSIC_REPEAT': case 'MUSIC_VOLUME': {
      const msg = await MusicPlayer.voice(action, rawText);
      if (msg) addTranscript('ai', msg);      /* transcript only — no TTS, so ARIA never talks over the music */
      break;
    }
  }
}

async function handleUtterance(rawText){
  const text = (rawText || '').trim();
  if (!text) return;
  addTranscript('user', text);
  const action = matchIntent(text);
  if (action){
    await runAction(action, text);
    return;
  }
  setState('THINKING');
  let reply;
  if (camOn){
    setState('VISION_ANALYSIS');
    const blob = await grabFrame();
    reply = await AIService.analyzeImage(blob, text);
  } else {
    reply = await AIService.chat(text);
  }
  addTranscript('ai', reply);
  speak(reply);
}

/* ============================================================
   Voice: speech recognition (STT)
   Migrated from the browser's built-in SpeechRecognition /
   webkitSpeechRecognition to Deepgram streaming STT:
   mic -> MediaRecorder -> WebSocket (/ws/stt) -> server.js -> Deepgram.
   ============================================================ */
const sttSupported = !!(window.MediaRecorder && window.WebSocket);
let micOn = false, continuousMode = false, heardTimer = null;
let micStream = null, micCtx = null, micAnalyser = null, micData = null;
let lastRecErrorAt = 0;
let mediaRecorder = null, sttSocket = null, finalBuffer = '';

/* Browsers pick the recognition language up front — there's no "detect
   what language is being spoken" mode — so this is a small, explicit
   toggle rather than a guess. Defaults from the device's own locale. */
let recognitionLang = (navigator.language || '').toLowerCase().startsWith('id') ? 'id-ID' : 'en-US';

function armHeardWatchdog(){
  clearTimeout(heardTimer);
  heardTimer = setTimeout(() => {
    if (micOn) showBanner("I'm not hearing anything yet \u2014 check that the mic is allowed and that you're online.", false, 'warn');
  }, 9000);
}

/* Avoids flooding the banner if the STT connection keeps failing and
   auto-restarting in a tight loop (e.g. no internet for a while). */
function showRecErrorThrottled(msg, err){
  const now = Date.now();
  if (now - lastRecErrorAt > 5000){
    lastRecErrorAt = now;
    notifyIssue(msg, err);
  }
}
const VOICE_UNSUPPORTED = "Voice input isn't supported in this browser \u2014 you can type commands instead.";
const VOICE_UNAVAILABLE = "Voice input isn't available right now \u2014 you can type commands instead.";

/* MediaRecorder's supported MIME types vary by browser — check rather
   than assume. Every candidate here is a containerized format, so
   Deepgram auto-detects encoding/sample rate from the container header
   and the server doesn't need to pass those as query params. */
function pickMimeType(){
  const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
  for (const c of candidates){
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

/* Opens the browser<->server STT WebSocket and, once it's open, starts
   MediaRecorder streaming audio chunks into it. Reconnects automatically
   while the mic is meant to be on, mirroring the old SpeechRecognition
   auto-restart-on-onend behavior. */
function connectSTT(){
  const mimeType = pickMimeType();
  if (!mimeType){
    logIssue('voice input', 'no supported audio recording format (MediaRecorder MIME type) in this browser');
    stopMic();
    notifyIssue(VOICE_UNSUPPORTED);
    textForm.hidden = false;                       /* recovery: the keyboard */
    return;
  }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  sttSocket = new WebSocket(proto + '//' + location.host + '/ws/stt?lang=' + encodeURIComponent(recognitionLang));

  sttSocket.onopen = () => {
    armHeardWatchdog();
    try {
      mediaRecorder = new MediaRecorder(micStream, { mimeType });
    } catch(e){
      logIssue('audio recorder (create)', e);
      stopMic();                                   /* stop first: stopMic() resets the state and would hide a banner shown before it */
      showRecErrorThrottled('Voice input had a problem \u2014 tap the mic to try again.', e);
      return;
    }
    mediaRecorder.ondataavailable = (ev) => {
      if (ev.data && ev.data.size > 0 && sttSocket && sttSocket.readyState === WebSocket.OPEN) sttSocket.send(ev.data);
    };
    mediaRecorder.onerror = (ev) => {
      logIssue('audio recorder', (ev && ev.error) || 'MediaRecorder error event');
      showRecErrorThrottled('Voice input had a problem \u2014 tap the mic to try again.', ev && ev.error);
    };
    try { mediaRecorder.start(250); } catch(e){
      logIssue('audio recorder (start)', e);
      stopMic();
      showRecErrorThrottled('Voice input had a problem \u2014 tap the mic to try again.', e);
    }
  };

  sttSocket.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch(_e) { return; }
    if (msg.type === 'error'){
      logIssue('speech service', msg.message || 'error message without text');   /* e.g. missing key / upstream failure: for the developer */
      stopMic();                                   /* stop first: stopMic() resets the state and would hide the banner */
      showRecErrorThrottled(VOICE_UNAVAILABLE, msg.message);
      textForm.hidden = false;                     /* recovery: the keyboard */
      return;
    }
    if (msg.type !== 'transcript') return;
    clearTimeout(heardTimer);
    if (msg.isFinal && msg.text) finalBuffer = (finalBuffer ? finalBuffer + ' ' : '') + msg.text;
    interimEl.textContent = msg.isFinal ? finalBuffer : (finalBuffer ? finalBuffer + ' ' + msg.text : msg.text);
    /* speechFinal marks the end of an utterance (Deepgram's endpointing
       detected a pause) — that's what should trigger handleUtterance(),
       exactly once, the same way a final SpeechRecognition result did. */
    if (msg.speechFinal){
      const toSend = finalBuffer.trim();
      finalBuffer = '';
      interimEl.textContent = '';
      if (toSend) handleUtterance(toSend);
    }
    armHeardWatchdog();
  };

  sttSocket.onerror = () => {
    logIssue('speech socket', 'WebSocket error while connecting to /ws/stt');
    showRecErrorThrottled("Can't reach voice recognition \u2014 check your internet connection.");
  };

  sttSocket.onclose = () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive'){ try { mediaRecorder.stop(); } catch(_e){} }
    mediaRecorder = null;
    if (micOn && continuousMode){
      /* small delay avoids hammering a socket that's failing to connect */
      setTimeout(() => { if (micOn && continuousMode) connectSTT(); }, 200);
    } else if (State.current === 'LISTENING') setState(restState());
  };
}

function setRecognitionLang(lang){
  if (micOn){ showBanner('Stop the mic first to switch language.'); return; }
  recognitionLang = lang;
  updateLangUI();
}
function updateLangUI(){
  if (langToggleEl) langToggleEl.textContent = recognitionLang === 'id-ID' ? 'LANG: ID' : 'LANG: EN';
}

async function startMic(){
  if (!sttSupported){
    logIssue('voice input', 'MediaRecorder / WebSocket not available in this browser');
    notifyIssue(VOICE_UNSUPPORTED);
    textForm.hidden = false;
    return;
  }
  if (micOn) return;
  micOn = true; continuousMode = true; finalBuffer = '';
  /* Unlike the old SpeechRecognition (which managed its own mic access
     internally), MediaRecorder needs the stream handed to it directly, so
     this is now required up front rather than best-effort. */
  try {
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
  } catch(e){
    micOn = false; continuousMode = false;
    logIssue('microphone', e);
    updateMicUI();
    const n = (e && e.name) || '';
    if (n === 'NotAllowedError' || n === 'PermissionDeniedError' || n === 'SecurityError'){
      setState('ERROR', {message: withDebug("Microphone access is blocked. Allow it in your browser's site settings to talk to ARIA.", e)});
    } else if (n === 'NotFoundError' || n === 'DevicesNotFoundError'){
      notifyIssue('No microphone was found on this device.', e);
    } else if (n === 'NotReadableError' || n === 'TrackStartError' || n === 'AbortError'){
      notifyIssue('The microphone is busy \u2014 close other apps that might be using it and try again.', e);
    } else {
      notifyIssue("The microphone couldn't start. Please try again.", e);
    }
    return;
  }
  setupAnalyser(micStream);
  setState(restState());   /* LISTENING — or MUSIC when the player is open */
  updateMicUI();
  connectSTT();
}
function stopMic(){
  micOn = false; continuousMode = false;
  clearTimeout(heardTimer);
  finalBuffer = '';
  if (mediaRecorder && mediaRecorder.state !== 'inactive'){ try { mediaRecorder.stop(); } catch(_e){} }
  mediaRecorder = null;
  if (sttSocket){ try { sttSocket.close(); } catch(_e){} sttSocket = null; }
  if (micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
  teardownAnalyser();
  updateMicUI();
  if (State.current === 'LISTENING') setState(restState());
}
function updateMicUI(){
  dotMic.classList.toggle('on', micOn);
  btnMic.classList.toggle('active', micOn);
  btnMic.setAttribute('aria-pressed', String(micOn));
}

function setupAnalyser(stream){
  try {
    micCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(stream);
    micAnalyser = micCtx.createAnalyser();
    micAnalyser.fftSize = 256;
    micData = new Uint8Array(micAnalyser.frequencyBinCount);
    src.connect(micAnalyser);
  } catch(_e){ micAnalyser = null; }
}
function teardownAnalyser(){
  if (micCtx){ micCtx.close().catch(()=>{}); }
  micCtx = null; micAnalyser = null; micData = null;
}
function sampleMicLevel(){
  if (!micAnalyser) return 0;
  micAnalyser.getByteFrequencyData(micData);
  let sum = 0; for (let i=0;i<micData.length;i++) sum += micData[i];
  return Math.min(1, (sum/micData.length)/110);
}

/* ============================================================
   Voice: text-to-speech (TTS)
   ============================================================ */
let speakPulse = 0;
let cachedVoices = [];
function refreshVoices(){
  if ('speechSynthesis' in window) cachedVoices = window.speechSynthesis.getVoices() || [];
}
if ('speechSynthesis' in window){
  refreshVoices();
  /* the voice list often loads asynchronously (esp. on first page load) —
     refresh again once the browser signals it's ready */
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

/* Lightweight, dependency-free language guess for ARIA's own reply text —
   just enough to pick a matching TTS voice/locale, never to translate. */
const ID_WORD_HINTS = /\b(yang|dan|ini|itu|saya|aku|kamu|tidak|nggak|akan|sudah|udah|bisa|dengan|untuk|adalah|apa|kenapa|bagaimana|gimana|silakan|terima kasih|makasih|baik|oke|tolong|kalau|karena|juga|lagi|mau|nya)\b/gi;
const EN_WORD_HINTS = /\b(the|and|is|are|you|this|that|not|will|already|can|with|for|what|why|how|please|thanks|thank|okay|because|hello|hi|there)\b/gi;
function detectReplyLang(text){
  const idHits = (text.match(ID_WORD_HINTS) || []).length;
  const enHits = (text.match(EN_WORD_HINTS) || []).length;
  if (idHits > enHits) return 'id-ID';
  if (enHits > idHits) return 'en-US';
  /* no clear signal (e.g. a very short reply) — assume whatever language
     the user is currently speaking/typing in */
  return recognitionLang;
}

/* Picks a voice actually declared for langCode by the browser/device — we
   only trust what the platform itself reports supporting, never guess.
   Returns null if nothing matches, so the caller can fall back safely. */
function pickVoice(langCode){
  if (!cachedVoices.length) refreshVoices();
  if (!cachedVoices.length) return null;
  const exact = cachedVoices.find(v => v.lang && v.lang.toLowerCase() === langCode.toLowerCase());
  if (exact) return exact;
  const prefix = langCode.split('-')[0].toLowerCase();
  const family = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
  if (!family.length) return null;
  /* a local/on-device voice is usually less robotic/accented than a
     generic network fallback for the same language, when one exists */
  return family.find(v => v.localService) || family[0];
}

function speak(text){
  if (!('speechSynthesis' in window)){ return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const langCode = detectReplyLang(text);
  u.lang = langCode;
  /* Setting u.lang alone already nudges most browsers toward a matching
     default voice. When we can also name an exact/family voice, do so —
     but if none is installed, leave u.voice unset rather than forcing a
     mismatched one; playback must never break over a missing voice. */
  const voice = pickVoice(langCode);
  if (voice) u.voice = voice;
  u.rate = 1.02;
  u.onboundary = () => { speakPulse = 1; };
  u.onstart = () => { MusicPlayer.duck(true); setState('SPEAKING'); };
  u.onend = () => { MusicPlayer.duck(false); setState(restState()); };
  u.onerror = () => { MusicPlayer.duck(false); setState(restState()); };
  window.speechSynthesis.speak(u);
}
function stopSpeaking(){ window.speechSynthesis.cancel(); }

/* interrupt speech whenever the user starts talking or typing */
function interruptIfSpeaking(){ if (window.speechSynthesis.speaking) window.speechSynthesis.cancel(); }

/* ============================================================
   Camera
   ============================================================ */
let currentStream = null, camOn = false, devices = [], deviceIndex = 0;

async function listCameras(){
  try {
    const all = await navigator.mediaDevices.enumerateDevices();
    devices = all.filter(d => d.kind === 'videoinput');
  } catch(_e){ devices = []; }
}

/* ============================================================
   Camera lifecycle
   Rules this block enforces:
   - at most ONE live camera MediaStream, ever: a start/switch that is cancelled, superseded or retried
     stops whatever it opened, and nothing opens while another open is still in flight;
   - a "camera busy" failure (NotReadableError and friends) is retried a bounded number of times with a short
     delay, releasing every camera stream before each retry;
   - every other failure is shown with its REAL error name and message, never a made-up cause;
   - when the page is hidden the camera/mic are stopped AND the user is told, on return, what was paused.
   ============================================================ */
const CAM_BUSY_RETRIES = 3;      /* retries after the first attempt (so at most 4 tries) */
const CAM_BUSY_DELAY_MS = 700;   /* wait before retry n = n * 700 ms (0.7 s, 1.4 s, 2.1 s) */
let camStartToken = 0;           /* bumped by every start / switch / stop: an operation holding an older token is stale and must clean up and bow out */
let camStarting = false, camSwitching = false;
let pausedByHidden = { camera: false, mic: false, hand: false };
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/* the camera is exclusive on phones: these mean "someone else has it / it hasn't been released yet" */
function isCameraBusyError(err){
  const n = err && err.name;
  return n === 'NotReadableError' || n === 'TrackStartError' || n === 'AbortError';
}
/* user-facing meaning of a camera failure. `blocking` = needs a settings change, so it gets the red error state;
   everything else is a calm amber notice. (The exact error name/message goes to the console via logIssue.) */
function cameraIssue(err){
  const n = (err && err.name) || '';
  if (n === 'NotAllowedError' || n === 'PermissionDeniedError') return { blocking: true, text: "Camera access is blocked. Allow it in your browser's site settings, then try again." };
  if (n === 'SecurityError') return { blocking: true, text: 'The browser blocked the camera on this page. Open ARIA over HTTPS or localhost.' };
  if (n === 'NotFoundError' || n === 'DevicesNotFoundError') return { text: 'No camera was found on this device.' };
  if (n === 'NotReadableError' || n === 'TrackStartError') return { text: 'The camera is busy \u2014 another app or tab may be using it. Close it and try again.' };
  if (n === 'AbortError') return { text: "The camera didn't start. Please try again." };
  if (n === 'OverconstrainedError' || n === 'ConstraintNotSatisfiedError') return { text: "This camera can't start with ARIA's settings. Try switching cameras." };
  return { text: "The camera couldn't start. Please try again." };
}
function reportCameraError(err, prefix){
  logIssue('camera', err);
  const issue = cameraIssue(err);
  const text = withDebug((prefix ? prefix + ' ' : '') + issue.text, err);
  if (issue.blocking) setState('ERROR', { message: text });
  else { if (State.current === 'ERROR') setState(restState()); showBanner(text, false, 'warn'); }
}
function releaseCameraStream(){                   /* the visible camera's stream */
  if (currentStream){ currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
}
function releaseAllCameraStreams(){               /* + the hidden standalone flashlight stream */
  releaseCameraStream();
  stopTorchStream();
}
/* getUserMedia with a bounded retry for "camera busy". Resolves with the stream, or null when this operation was
   superseded while waiting (any stream that arrived is stopped right here, so a stale operation can never leave
   a live stream behind). Rejects with the real error, tagged with the number of attempts made. */
async function openCameraStream(constraints, token, onRetry){
  let lastErr = null;
  for (let attempt = 0; attempt <= CAM_BUSY_RETRIES; attempt++){
    if (attempt > 0){
      releaseAllCameraStreams();                  /* nothing — not even a leftover — may still hold the device when we retry */
      onRetry(attempt);
      await sleep(CAM_BUSY_DELAY_MS * attempt);
      if (token !== camStartToken) return null;
    }
    let stream = null;
    try { stream = await navigator.mediaDevices.getUserMedia(constraints); }
    catch(e){ lastErr = e; }
    if (token !== camStartToken){
      if (stream) stream.getTracks().forEach(t => t.stop());
      return null;
    }
    if (stream) return stream;
    if (!isCameraBusyError(lastErr)){ try { lastErr.ariaAttempts = attempt + 1; } catch(_e){} throw lastErr; }
  }
  try { lastErr.ariaAttempts = CAM_BUSY_RETRIES + 1; } catch(_e){}
  throw lastErr;
}

async function startCamera(opts){
  opts = opts || {};
  if (camOn || camStarting) return;               /* never open a second stream on top of one that is open / opening */
  interruptIfSpeaking();
  camStarting = true;
  const token = ++camStartToken;
  /* if the flashlight was running standalone (no camera UI open), release
     that hidden stream first — opening the visible camera gets its own */
  releaseAllCameraStreams();
  try {
    let stream;
    try {
      stream = await openCameraStream({video:{facingMode:'environment'}}, token, (n) => {
        showBanner('The camera is busy \u2014 trying again\u2026');
      });
    } catch(err){
      if (token === camStartToken) reportCameraError(err, opts.errorPrefix);
      return;
    }
    if (!stream) return;                          /* cancelled while opening */
    currentStream = stream;
    camVideo.srcObject = currentStream;
    syncMirror();                                 /* front camera -> mirrored preview, before the first frame shows */
    try { await camVideo.play(); } catch(_e){}
    if (token !== camStartToken) return;          /* cancelled during play(): the canceller already released the stream */
    try { await listCameras(); } catch(_e){}
    if (token !== camStartToken) return;
    const activeId = currentStream.getVideoTracks()[0].getSettings().deviceId;
    deviceIndex = Math.max(0, devices.findIndex(d => d.deviceId === activeId));
    setCamVisible(true);
    resetZoom();
    setState(restState());
    addTranscript('ai', 'Camera online.');
    if (opts.resumedNote) showBanner(opts.resumedNote);      /* setState() just cleared the banner: say it again so the user actually sees it */
    /* diagnostics only (no behaviour): what the browser actually delivered — useful for orientation problems */
    try {
      const st = currentStream.getVideoTracks()[0].getSettings();
      console.info('[ARIA] camera started', { frame: camVideo.videoWidth + 'x' + camVideo.videoHeight, settings: { width: st.width, height: st.height, facingMode: st.facingMode, deviceId: st.deviceId },
        screenOrientation: (screen.orientation && screen.orientation.type) || null, window: innerWidth + 'x' + innerHeight });
    } catch(_e){}
  } finally {
    if (token === camStartToken) camStarting = false;
  }
}
function stopCamera(){
  camStartToken++; camStarting = false; camSwitching = false;   /* abort any start / switch still in flight */
  disableHandTracking();
  releaseCameraStream();
  camVideo.srcObject = null;
  syncMirror();                                   /* no stream -> back to unmirrored */
  setCamVisible(false);
  setState(restState());
}
async function switchCamera(){
  if (devices.length < 2){ showBanner('Only one camera is available.'); return; }
  if (!camOn || camSwitching || camStarting) return;           /* one open at a time */
  camSwitching = true;
  const token = ++camStartToken;
  const prevIndex = deviceIndex;
  deviceIndex = (deviceIndex + 1) % devices.length;
  releaseCameraStream();
  const open = (index) => openCameraStream({video:{deviceId:{exact: devices[index].deviceId}}}, token, (n) => {
    showBanner('The camera is busy \u2014 trying again\u2026');
  });
  try {
    const stream = await open(deviceIndex);
    if (!stream) return;                          /* cancelled (stopCamera already cleaned up) */
    currentStream = stream;
    camVideo.srcObject = currentStream;
    syncMirror();                                 /* the new camera may face the other way */
    resetZoom();
  } catch(err){
    if (token !== camStartToken) return;
    /* the old camera was released to make room: put it back so the user isn't left with a frozen picture */
    deviceIndex = prevIndex;
    try {
      const back = await open(prevIndex);
      if (!back) return;
      currentStream = back;
      camVideo.srcObject = currentStream;
      syncMirror();
      resetZoom();
      setState(restState());
      logIssue('camera switch', err);
      notifyIssue("Couldn't switch cameras \u2014 staying on the current one. " + cameraIssue(err).text, err);
    } catch(_e2){
      if (token !== camStartToken) return;
      stopCamera();
      reportCameraError(err, "Couldn't switch cameras.");
    }
  } finally {
    if (token === camStartToken) camSwitching = false;
  }
}
function setCamVisible(on){
  camOn = on;
  camVideo.classList.toggle('visible', on);
  camOverlay.classList.toggle('visible', on);
  camControls.classList.toggle('show', on);
  btnCam.classList.toggle('active', on);
  btnCam.setAttribute('aria-pressed', String(on));
  dotCam.classList.toggle('on', on);
  if (on) sizeOverlay();
}
function sizeOverlay(){
  /* layout size, not getBoundingClientRect(): the video carries a CSS transform (zoom / mirror) that the bounding
     rect would include. Canvas px must equal layout px for frameToScreen(). */
  camOverlay.width = camVideo.clientWidth; camOverlay.height = camVideo.clientHeight;
}
window.addEventListener('resize', () => { if (camOn) sizeOverlay(); });

async function grabFrame(){
  const c = document.createElement('canvas');
  c.width = camVideo.videoWidth || 640;
  c.height = camVideo.videoHeight || 480;
  c.getContext('2d').drawImage(camVideo, 0, 0, c.width, c.height);
  return new Promise((resolve) => c.toBlob((b) => resolve(b), 'image/jpeg', 0.85));
}

async function takeSnapshot(){
  if (!camOn){ showBanner('Open the camera first to take a snapshot.'); return; }
  const blob = await grabFrame();
  const filename = 'aria-snapshot-' + Date.now() + '.jpg';
  if (downloadsCap){
    try { await downloadsCap.save({filename, data: blob}); addTranscript('ai', 'Snapshot saved.'); }
    catch(e){ logIssue('snapshot save', e); addTranscript('ai', "I couldn't save that snapshot \u2014 please try again."); }
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    addTranscript('ai', 'Snapshot downloaded.');
  }
}

/* ---- Gesture Zoom System (see §5 of the brief) ----
   1. capture the starting distance/level
   2. track continuously
   3. compute the delta from start
   4. convert delta -> a target zoom
   5. smooth/interpolate toward the target
   6. clamp to sane limits
   7. lightly damp to reduce jitter                              */
let zoomLevel = 1, smoothedZoom = 1;
const ZOOM_MIN = 1, ZOOM_MAX = 4;
let nativeZoomCap = null;

/* ---- Front-camera mirroring & camera display geometry ----
   What the user sees is a chain applied by the browser to the RAW frame:
       raw frame -> object-fit:cover (centre crop) -> mirror (front camera only) -> software zoom (CSS scale)
   What MediaPipe gets is different: hands.send({image: camVideo}) reads the raw decoded frame, with NONE of the
   above, so landmarks are normalised (0..1) to the raw frame. A CSS mirror alone therefore leaves hand-tracking
   in a different coordinate system from the picture. The fix is one conversion, frameToScreen(), which replays
   the display chain for a landmark; the frame sent to MediaPipe (and the frame sent to the AI / snapshot,
   see grabFrame) deliberately stays raw and is never flipped twice.
   Only the preview is mirrored; the rear camera is left natural. */
let camMirrored = false;

/* 'user' -> selfie camera. Phones report it reliably; if a browser reports nothing (most desktop webcams), fall
   back to the device name. Anything still unknown is treated as NOT front-facing, i.e. today's behaviour. */
function isFrontFacing(stream){
  const track = stream && stream.getVideoTracks && stream.getVideoTracks()[0];
  if (!track) return false;
  let facing = '';
  try { facing = String(track.getSettings().facingMode || '').toLowerCase(); } catch(_e){}
  if (facing) return facing === 'user';               /* 'environment' / 'left' / 'right' stay natural */
  const label = String(track.label || '').toLowerCase();
  if (/\b(back|rear|environment|world)\b/.test(label)) return false;
  return /\b(front|user|facetime|selfie)\b/.test(label);
}
/* zoom that is really a CSS scale: native (sensor) zoom already changes the frame itself */
const cssZoom = () => nativeZoomCap ? 1 : +zoomLevel.toFixed(3);
/* the ONLY writer of the video's transform (mirror + zoom compose here instead of overwriting each other) */
function renderVideoTransform(){
  camVideo.style.transform = (camMirrored ? 'scaleX(-1) ' : '') + 'scale(' + cssZoom() + ')';
}
function syncMirror(){
  camMirrored = isFrontFacing(currentStream);
  camVideo.dataset.mirrored = String(camMirrored);
  renderVideoTransform();
}
/* landmark (normalised raw-frame coords) -> overlay canvas pixel, i.e. where that point of the hand appears on
   screen. The overlay canvas is sized to the video's layout box (sizeOverlay), so canvas px == layout px. */
function frameToScreen(nx, ny){
  const bw = camVideo.clientWidth, bh = camVideo.clientHeight;
  const fw = camVideo.videoWidth || bw, fh = camVideo.videoHeight || bh;
  const s = Math.max(bw / fw, bh / fh);                         /* object-fit: cover */
  let x = (bw - fw * s) / 2 + nx * fw * s;
  let y = (bh - fh * s) / 2 + ny * fh * s;
  if (camMirrored) x = bw - x;                                  /* flip about the box centre (transform-origin: center) */
  const z = cssZoom();                                          /* software zoom also scales about the centre */
  return { x: bw / 2 + (x - bw / 2) * z, y: bh / 2 + (y - bh / 2) * z };
}

function resetZoom(){
  zoomLevel = 1; smoothedZoom = 1;
  renderVideoTransform();
  nativeZoomCap = null;
  const track = currentStream && currentStream.getVideoTracks()[0];
  if (track && track.getCapabilities){
    try {
      const caps = track.getCapabilities();
      if (caps.zoom) nativeZoomCap = {min:caps.zoom.min, max:caps.zoom.max, track};
    } catch(_e){}
  }
  updateZoomLabel();
}
function applyZoom(target){
  zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, target));
  if (nativeZoomCap){
    const t = nativeZoomCap;
    const value = t.min + (zoomLevel - 1) / (ZOOM_MAX - 1) * (t.max - t.min);
    t.track.applyConstraints({advanced:[{zoom:value}]}).catch(()=>{});
  } else {
    renderVideoTransform();
  }
  updateZoomLabel();
}
function nudgeZoom(delta){ smoothedZoom = zoomLevel; applyZoom(zoomLevel + delta); }
function updateZoomLabel(){ zoomLbl.textContent = zoomLevel.toFixed(2) + 'x'; }

/* ---- Flashlight / torch control ----
   Same getCapabilities/getSettings/applyConstraints pattern as zoom above.
   Torch is only ever exposed via a camera video track — there's no
   separate "flashlight" API in browsers — so using it without the visible
   camera UI open means quietly holding a hidden, preview-less stream
   (torchStream) just for that track. camOn / the camera UI never change
   because of this; the only outward sign is the OS's own camera-in-use
   indicator, which we can't and shouldn't suppress. */
let torchStream = null;
function getActiveVideoTrack(){
  if (camOn && currentStream) return currentStream.getVideoTracks()[0];
  if (torchStream) return torchStream.getVideoTracks()[0];
  return null;
}
function torchSupported(){
  const track = getActiveVideoTrack();
  if (!track || !track.getCapabilities) return false;
  try { return !!track.getCapabilities().torch; } catch(_e){ return false; }
}
function torchIsOn(){
  const track = getActiveVideoTrack();
  if (!track || !track.getSettings) return false;
  try { return !!track.getSettings().torch; } catch(_e){ return false; }
}
function stopTorchStream(){
  if (torchStream){ torchStream.getTracks().forEach(t => t.stop()); torchStream = null; }
}
async function setTorch(on){
  if (on && !camOn && !torchStream){
    /* nothing open yet — grab a background-only stream just for the torch */
    let ts;
    try {
      ts = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    } catch(e){
      logIssue('flashlight (camera access)', e);
      addTranscript('ai', "I can't reach the camera for the flashlight right now \u2014 it may be in use.");
      return;
    }
    if (camOn || camStarting){ ts.getTracks().forEach(t => t.stop()); }   /* the camera UI took the camera meanwhile: never hold two streams */
    else torchStream = ts;
  }
  const track = getActiveVideoTrack();
  if (!track){
    addTranscript('ai', 'Turn the camera on first — the flashlight uses the camera.');
    return;
  }
  if (!torchSupported()){
    addTranscript('ai', "Flashlight control isn't supported on this device.");
    stopTorchStream();
    return;
  }
  try {
    await track.applyConstraints({ advanced: [{ torch: on }] });
    addTranscript('ai', on ? 'Flashlight on.' : 'Flashlight off.');
  } catch(e){
    logIssue('flashlight', e);
    addTranscript('ai', "I couldn't switch the flashlight just now \u2014 please try again.");
  }
  /* flashlight is off and it was running on the hidden background stream
     (not the visible camera) — release it, no reason to keep the sensor open */
  if (!on) stopTorchStream();
}

/* touch pinch-to-zoom + wheel + swipe + tap/double-tap/long-press */
let pinchStartDist = null, pinchStartZoom = 1;
function touchDist(a,b){ return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }

let pressTimer = null, pressFired = false, touchStartX = 0, touchStartT = 0, lastTapT = 0;

stage.addEventListener('touchstart', (e) => {
  if (!camOn) return;
  if (e.touches.length === 2){
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartZoom = zoomLevel;
    smoothedZoom = zoomLevel;
  } else if (e.touches.length === 1){
    touchStartX = e.touches[0].clientX;
    touchStartT = Date.now();
    pressFired = false;
    pressTimer = setTimeout(() => {
      pressFired = true;
      pauseGesture();
      markTap(e.touches[0].clientX, e.touches[0].clientY, true);
    }, 650);
  }
}, {passive:true});

stage.addEventListener('touchmove', (e) => {
  if (!camOn) return;
  if (e.touches.length === 2 && pinchStartDist){
    const d = touchDist(e.touches[0], e.touches[1]);
    const target = pinchStartZoom * (d / pinchStartDist);
    smoothedZoom += (target - smoothedZoom) * 0.35; /* interpolation + stabilization */
    applyZoom(smoothedZoom);
  } else if (pressTimer){
    clearTimeout(pressTimer);
  }
}, {passive:true});

stage.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) pinchStartDist = null;
  if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  if (!camOn || pressFired) return;
  if (touchStartX !== undefined && Date.now() - touchStartT < 500){
    const changed = e.changedTouches[0];
    const dx = changed.clientX - touchStartX;
    if (Math.abs(dx) > 70){ /* swipe */
      switchCamera();
    } else {
      const now = Date.now();
      if (now - lastTapT < 320){ takeSnapshot(); }      /* double-tap = confirm */
      else { markTap(changed.clientX, changed.clientY, false); } /* tap = point */
      lastTapT = now;
    }
  }
});
stage.addEventListener('wheel', (e) => {
  if (!camOn) return;
  e.preventDefault();
  nudgeZoom(e.deltaY < 0 ? 0.12 : -0.12);
}, {passive:false});

function markTap(x, y, isPause){
  const m = document.createElement('div');
  m.className = 'tap-mark';
  m.style.left = x + 'px'; m.style.top = y + 'px';
  m.style.borderColor = isPause ? 'var(--rose-solid)' : 'var(--cyan-solid)';
  stage.appendChild(m);
  requestAnimationFrame(()=>m.classList.add('show'));
  setTimeout(()=>m.remove(), 550);
}
function pauseGesture(){ stopSpeaking(); showBanner('Paused.'); setState(restState()); }

/* ============================================================
   Hand tracking (experimental / best-effort — see §4 of the brief)
   Falls back silently to the touch gestures above if the external
   model cannot be reached from this session.
   ============================================================ */
let handTrackingActive = false, handsLoading = false, handsInstance = null, handPinchStart = null, handPinchZoomStart = 1;
let handLoadToken = 0, handHintTimer = null;   /* handLoadToken: bumped on every enable / cancel / failure — a load holding an older token is stale */

/* The chip shows the truth: LOADING until MediaPipe has actually processed a frame, READY only then. (initialize()
   alone is not proof: it resolves before the model file is used, so a missing/corrupt model only shows up on frame 1.) */
function setHandStatus(kind){
  gestureLbl.textContent = { off: 'TOUCH', loading: 'HAND TRACKING: LOADING\u2026', ready: 'HAND TRACKING: READY' }[kind];
  btnHand.classList.toggle('active', kind === 'ready');
  btnHand.setAttribute('aria-busy', String(kind === 'loading'));
}
function closeHands(inst){
  if (!inst) return;
  try { const r = inst.close(); if (r && r.catch) r.catch(() => {}); } catch(_e){}
}

function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    const failed = () => { const e = new Error('Could not download ' + src + ' (offline, blocked, or the CDN is unreachable).'); e.ariaKind = 'network'; reject(e); };
    const existing = document.querySelector('script[data-src="'+src+'"]');
    if (existing){
      if (existing.dataset.loaded === '1') return resolve();
      existing.addEventListener('load', () => resolve());     /* a load is already in flight: wait for it */
      existing.addEventListener('error', failed);
      return;
    }
    const s = document.createElement('script');
    s.src = src; s.dataset.src = src;
    s.onload = () => { s.dataset.loaded = '1'; resolve(); };
    s.onerror = () => { s.remove(); failed(); };              /* remove the dead tag, or every retry would "succeed" without a library */
    document.head.appendChild(s);
  });
}

btnHand.addEventListener('click', () => {
  if (handsLoading){ disableHandTracking(); showBanner('Hand tracking loading cancelled.'); }
  else if (handTrackingActive) disableHandTracking();
  else enableHandTracking();
});

function failHandTracking(err, token, inst){
  if (token !== handLoadToken) return;
  logIssue('hand tracking', err);
  disableHandTracking();                                      /* resets flags + label, closes handsInstance */
  closeHands(inst);
  notifyIssue((err && err.ariaKind === 'network')
    ? "Hand tracking couldn't load \u2014 check your internet connection. Touch gestures are still available."
    : "Hand tracking couldn't start. Touch gestures are still available.", err);
}

async function enableHandTracking(){
  if (!camOn){ showBanner('Turn the camera on first.'); return; }
  if (handTrackingActive || handsLoading) return;
  const token = ++handLoadToken;
  handsLoading = true;
  setHandStatus('loading');
  clearTimeout(handHintTimer);
